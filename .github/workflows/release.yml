# Builds spoty.exe and attaches it to a draft GitHub release whenever a version tag
# (e.g. v0.1.0) is pushed. Review the draft on GitHub, then publish it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} doesn't match Cargo.toml version $version"
            exit 1
          }

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/spoty.exe spoty.exe
          $hash = (Get-FileHash spoty.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  spoty.exe" | Out-File -Encoding ascii spoty.exe.sha256

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Spoty ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            spoty.exe
            spoty.exe.sha256
